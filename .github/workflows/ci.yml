name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # torch is deliberately NOT installed here: the oracle gates -- the tests that
      # actually protect the science -- must pass without it, and the CUDA wheel is ~4 GB.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Format check
        run: ruff format --check src tests scripts
      - name: Oracle correctness gates
        run: pytest tests/test_oracle_analytic.py -q
      - name: Full suite (excluding tests needing MNIST or torch)
        run: pytest tests/ -q -m "not needs_mnist and not needs_torch"
